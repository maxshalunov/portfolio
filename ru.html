  var lx2=lsR-lw2, lxd=lx2-lwd, lx1=lxd-lw1;

  ctx.fillStyle=LANG==='en'?C_HOT:(lHot?C_HOT:C_MID); tracked('EN',lx1,lsY,2,'left');
  ctx.fillStyle=C_DIM; tracked(' · ',lxd,lsY,0,'left');
  ctx.fillStyle=LANG==='ru'?C_HOT:(lHot?C_HOT:C_MID); tracked('RU',lx2,lsY,2,'left');

  if(lHot){ ctx.fillStyle=C_HOT; ctx.fillRect(lox,lsY+4,low-2,1); }
  LANGB={x:lox-10,y:lsY-(W<760?12:14),w:low+20,h:W<760?20:24};
  ctx.globalAlpha=1;

  /* ---- field ---- */
  var R=W<760?110:150, R2=R*R, ad=atlasDim, ah=atlasHot, litNow=0, revNow=0;

      var lit=Math.max(0,Math.min(1,(t-c.ig)/0.9));

    tracked(sec.bin,x+bw/2,y+(W<760?31:34),btr,'center');

  });


  if(openId) drawPanel(SECTIONS.filter(function(x){return x.id===openId;})[0],l,t);
  else { CLOSE=null; BACK=null; CARDS.length=0; PREVB=null; NEXTB=null; }
}

function openURL(u){
  try{

    a.href=u; a.target='_blank'; a.rel='noopener noreferrer';
    a.style.display='none';
    document.body.appendChild(a); a.click();

      ctx.beginPath(); ctx.moveTo(ix,y); ctx.lineTo(ix+iw,y); ctx.stroke();
      y+=small?22:28;
    }else if(b.t==='tags'){
      y+=small?16:22;
      var tgx=ix, tgl=small?22:26, tgg=small?15:21;
      b.v.forEach(function(tg){
        var lab=tg.replace(/ /g,'-');
        ctx.font='400 '+(small?8.5:10)+'px Inter, sans-serif';
        var hw=measTracked('#',0)+(small?2:2.5), tgw=measTracked(lab,1.6), unit=hw+tgw;
        if(tgx>ix&&tgx+unit>ix+iw){ tgx=ix; y+=tgl; }
        ctx.fillStyle='rgba(240,199,120,0.7)';
        tracked('#',tgx,y,0,'left');
        ctx.fillStyle=C_MID;
        tracked(lab,tgx+hw,y,1.6,'left');
        tgx+=unit+tgg;
      });
      y+=small?18:24;
    }else if(b.t==='sign'){
      y+=small?10:14;
      ctx.strokeStyle='rgba(63,126,121,0.3)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(ix,y-(small?12:16)); ctx.lineTo(ix+(small?40:54),y-(small?12:16)); ctx.stroke();
      ctx.fillStyle='rgba(108,184,176,0.88)';
      ctx.font='400 '+(small?11.5:13.5)+'px Inter, sans-serif';
      wrap(b.v,Math.min(iw,small?iw:520)).forEach(function(ln){ctx.fillText(ln,ix,y);y+=small?18:22;});
      y+=small?4:6;
    }else if(b.t==='slink'){
      y+=small?12:16;
      ctx.font='400 '+(small?8:9.5)+'px Inter, sans-serif';
      var sw2=measTracked(b.v,2.2), sox=b.icon?(small?19:24):0;
      var sy0=y-(small?14:17);
      var shot=(mx>=ix-6&&mx<=ix+sox+sw2+24&&my>=sy0&&my<=sy0+(small?26:30));
      if(b.icon) drawIcon(b.icon, ix, y-(small?10:12), small?11:13, shot?C_WARN:C_MID);
      ctx.fillStyle=shot?C_WARN:C_MID;
      tracked(b.v,ix+sox,y,2.2,'left');
      ctx.fillStyle=shot?C_WARN:C_DIM;
      tracked('↗',ix+sox+sw2+(small?7:9),y,0,'left');
      if(shot){ ctx.fillStyle='rgba(240,199,120,0.45)'; ctx.fillRect(ix+sox,y+4,sw2,1); }
      LINKS.push({x:ix-6,y:sy0,w:sox+sw2+30,h:(small?26:30),act:'open',href:b.href,val:b.v});
      y+=small?18:22;
    }else if(b.t==='drive'){
      y+=small?8:12;
      ctx.font='400 '+(small?7.5:9)+'px Inter, sans-serif';
      var dt=b.v||UI.allMotion;
      var dw=measTracked(dt,2.4), dic=small?17:21, dx=ix+iw-dw, dy0=y-(small?12:14);
      var dhot=(mx>=dx-dic-8&&mx<=dx+dw+8&&my>=dy0&&my<=dy0+(small?24:28));
      drawIcon('drive', dx-dic, y-(small?9:11), small?10:12, dhot?C_WARN:C_MID);
      ctx.fillStyle=dhot?C_WARN:C_MID;
      tracked(dt,dx,y,2.4,'left');
      if(dhot){ ctx.fillStyle='rgba(240,199,120,0.5)'; ctx.fillRect(dx,y+4,dw,1); }
      LINKS.push({x:dx-dic-8,y:dy0,w:dw+dic+16,h:(small?24:28),act:'open',href:(b.href||DRIVE_URL),val:dt});
      y+=small?20:26;
    }else if(b.t==='cards'){
      y+=small?4:8;
      CARDS.length=0;
      var per2=small?1:2, gap=12;
      var cw2=(iw-(per2-1)*gap)/per2, chh=small?84:96, rowY2=y;
      b.v.forEach(function(cs,k){
        var col=k%per2; if(col===0&&k>0) rowY2+=chh+gap;
        var ca2=Math.max(0,Math.min(1,(age-0.12-k*0.09)/0.34));
        var cl=1-Math.pow(1-ca2,3);
        ctx.globalAlpha=ca2;
        var bx=ix+col*(cw2+gap);
        var hot=(mx>=bx&&mx<=bx+cw2&&my>=rowY2&&my<=rowY2+chh);
        var shiftY=(1-cl)*18-(hot?3:0); rowY2+=shiftY;
        ctx.fillStyle=hot?'rgba(155,233,224,0.10)':'rgba(155,233,224,0.03)';
        ctx.fillRect(bx,rowY2,cw2,chh);
        rect(bx,rowY2,cw2,chh,hot?C_HI:'rgba(63,126,121,0.6)',1);
        /* folder tab */
        ctx.fillStyle=hot?C_HI:C_DIM; ctx.fillRect(bx,rowY2,small?40:52,3);
        ctx.fillStyle=C_DIM; ctx.font='400 '+(small?7.5:8.5)+'px Inter, sans-serif';
        tracked(cs.k,bx+12,rowY2+(small?22:24),2.4,'left');
        /* long titles shrink to stay inside their card */
        var tfs=small?15:18, ttr=small?2:3;
        ctx.fillStyle=hot?C_HOT:C_HI; ctx.font='700 '+tfs+'px Inter, sans-serif';
        while(measTracked(cs.title,ttr)>cw2-24 && tfs>10){ tfs-=0.5; ttr=Math.max(1,ttr-0.15); ctx.font='700 '+tfs+'px Inter, sans-serif'; }
        tracked(cs.title,bx+12,rowY2+(small?44:48),ttr,'left');
        ctx.fillStyle=C_DIM; ctx.font='400 '+(small?7:8)+'px Inter, sans-serif';
        tracked(cs.meta,bx+12,rowY2+(small?62:68),1.8,'left');
        ctx.fillStyle=C_DIM; ctx.font='400 '+(small?7:8)+'px Inter, sans-serif';
        tracked(UI.openCard,bx+cw2-(small?10:14)-measTracked(UI.openCard,1.8),rowY2+(small?70:76),1.8,'left');
        CARDS.push({x:bx,y:rowY2-shiftY,w:cw2,h:chh,i:k});
        rowY2-=shiftY;
      });
      ctx.globalAlpha=1;
      y=rowY2+chh+(small?10:14);
    }
    y-=bo; ctx.globalAlpha=1;
  });
  return y;
}

function drawPanel(s,l,t){
  var fx=l.pad+(W<760?6:38), fy=l.pad+(W<760?6:30);
  var fw=W-fx*2, fh=H-fy*2-(W<760?60:66);
  /* on wide screens the panel stays a window centred over the field */
  var PMAX=920; if(fw>PMAX){ fx=(W-PMAX)/2; fw=PMAX; }
  var o=panelOrigin||{x:W/2-50,y:H-90,w:100,h:46};
  var p1=Math.max(0,Math.min(1,panelA/0.46)), p2=Math.max(0,Math.min(1,(panelA-0.38)/0.62));
  var e1=1-Math.pow(1-p1,3), e2=1-Math.pow(1-p2,3);
  var pw=o.w+(fw-o.w)*e1, ph=3+(fh-3)*e2;
  var cxA=o.x+o.w/2, cyA=o.y+o.h/2, cxB=fx+fw/2, cyB=fy+fh/2;
  var px=(cxA+(cxB-cxA)*e1)-pw/2, py=(cyA+(cyB-cyA)*e1)-ph/2;
  var ready=panelA>0.80;
  ctx.fillStyle='rgba(2,11,14,'+(0.965*Math.min(1,p2*2.2)).toFixed(3)+')';
  ctx.fillRect(px,py,pw,ph);
  if(p2<0.34){
    ctx.globalAlpha=0.42; ctx.fillStyle=C_HI;
    ctx.fillRect(px,py+ph/2-4,pw,8);
    ctx.globalAlpha=1; ctx.fillStyle=C_HOT;
    ctx.fillRect(px,py+ph/2-1,pw,2);
  }
  rect(px,py,pw,ph,p2<0.92?C_HOT:C_HI,1);
  PANEL={x:px,y:py,w:pw,h:ph};
  if(pw>80&&ph>80) rect(px+6,py+6,pw-12,ph-12,'rgba(63,126,121,0.4)',1);
  if(!ready){ CLOSE=null; BACK=null; CARDS.length=0; PREVB=null; NEXTB=null; return; }

  var ix=px+(W<760?18:36), iy=py+(W<760?30:44), iw=Math.min(pw-(W<760?36:72),780);
  var small=W<760;
  var cs = (openCase!==null) ? CASES[openCase] : null;

  ctx.textAlign='left';
  var cxs=px+pw-(small?22:38), cys=iy+(small?-2:2);
  var hdW=Math.min(iw, cxs-24-ix);           /* header text stops before the close box */
  /* kicker: loosen tracking, then size, until it clears the X */
  var kfs=small?8.5:10, ktr=2.8, kt=cs?cs.k+' — '+cs.meta:UI.section+s.n;
  ctx.fillStyle=C_DIM; ctx.font='400 '+kfs+'px Inter, sans-serif';
  while(measTracked(kt,ktr)>hdW && (ktr>1.2||kfs>6.5)){
    if(ktr>1.2) ktr=Math.max(1.2,ktr-0.2); else kfs-=0.25;
    ctx.font='400 '+kfs+'px Inter, sans-serif';
  }
  tracked(kt, ix, iy, ktr,'left');
  /* title: shrink to a floor, then break onto two lines */
  var tt=cs?cs.title:s.title, tfs0=small?22:32, tfs=tfs0, ttr=small?3.6:5.6, tmin=small?16:24;
  ctx.fillStyle=C_HOT; ctx.font='700 '+tfs+'px Inter, sans-serif';
  while(measTracked(tt,ttr)>hdW && tfs>tmin){ tfs-=0.5; ttr=Math.max(1.6,ttr-0.1); ctx.font='700 '+tfs+'px Inter, sans-serif'; }
  var tLines=[tt];
  if(measTracked(tt,ttr)>hdW){
    var tw_=tt.split(' '), best=null;
    for(var bi=1;bi<tw_.length;bi++){
      var a=tw_.slice(0,bi).join(' '), b=tw_.slice(bi).join(' ');
      var m=Math.max(measTracked(a,ttr),measTracked(b,ttr));
      if(!best||m<best.m) best={a:a,b:b,m:m};
    }
    if(best){ tLines=[best.a,best.b];
      while(best.m>hdW && tfs>12){ tfs-=0.5; ctx.font='700 '+tfs+'px Inter, sans-serif';
        best.m=Math.max(measTracked(best.a,ttr),measTracked(best.b,ttr)); } }
  }
  var tLH=Math.round(tfs*1.18), tExtra=(tLines.length-1)*tLH;
  for(var li=0;li<tLines.length;li++) tracked(tLines[li], ix, iy+(small?28:40)-(tfs0-tfs)*0.35+li*tLH, ttr,'left');

  /* close */
  ctx.strokeStyle=C_HI; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(cxs-7,cys-7); ctx.lineTo(cxs+7,cys+7);
  ctx.moveTo(cxs+7,cys-7); ctx.lineTo(cxs-7,cys+7); ctx.stroke();
  ctx.globalAlpha=0.5; ctx.strokeStyle=C_DIM;
  ctx.strokeRect(cxs-16.5,cys-16.5,33,33); ctx.globalAlpha=1;
  CLOSE={x:cxs-20,y:cys-20,w:40,h:40};

  /* back */
  BACK=null;

  var navH=small?34:40;
  var top=iy+(small?44:62)+tExtra, bot=py+ph-(small?18:26)-navH;
  if(cs){
    /* the folder, opened: same tab as the card it came from */
    var frx=ix-(small?12:18), fry=top-(small?6:8);
    var frw=iw+(small?24:36), frh=bot-top+(small?4:6);
    ctx.fillStyle='rgba(155,233,224,0.025)'; ctx.fillRect(frx,fry,frw,frh);
    rect(frx,fry,frw,frh,'rgba(63,126,121,0.6)',1);
    ctx.fillStyle=C_HI; ctx.fillRect(frx,fry,small?44:58,2.5);
  }
  ctx.save(); ctx.beginPath(); ctx.rect(px+8,top,pw-16,bot-top); ctx.clip();
  LINKS.length=0; EXPROWS.length=0;
  var y=top+(small?14:20)-panelScroll;
  var cix=ix, ciw=iw;
  if(cs&&cs.img&&IMGS[cs.img]&&IMGS[cs.img].complete&&IMGS[cs.img].naturalWidth){
    var iwd=small?104:168, ihd=Math.round(iwd*16/9);
    ctx.drawImage(IMGS[cs.img], ix, y-(small?4:6), iwd, ihd);
    rect(ix,y-(small?4:6),iwd,ihd,'rgba(63,126,121,0.75)',1);
    if(small){ y+=ihd+(small?14:0); }
    else { cix=ix+iwd+26; ciw=iw-iwd-26; }
  }
  var blkAge=Math.max(0,t-contentT);
  var allB=cs?cs.blocks:s.blocks, mainB=[], footB=[];
  for(var bq=0;bq<allB.length;bq++){ (allB[bq].foot?footB:mainB).push(allB[bq]); }
  var mainW=ciw;
  var pim=(!cs&&s.photo&&IMGS[s.photo]&&IMGS[s.photo].complete&&IMGS[s.photo].naturalWidth)?IMGS[s.photo]:null;
  if(pim){
    ctx.globalAlpha=Math.max(0,Math.min(1,blkAge/0.5));
    var ps;
    if(small){
      ps=Math.min(132,Math.round(ciw*0.46));
      ctx.drawImage(pim, cix, y-4, ps, ps);
      rect(cix,y-4,ps,ps,'rgba(63,126,121,0.7)',1);
      ctx.fillStyle=C_HI; ctx.fillRect(cix,y-4,22,2);
      y+=ps+14;
    }else{
      ps=Math.min(238,Math.round(ciw*0.34));
      ctx.drawImage(pim, cix+ciw-ps, y-8, ps, ps);
      rect(cix+ciw-ps,y-8,ps,ps,'rgba(63,126,121,0.7)',1);
      ctx.fillStyle=C_HI; ctx.fillRect(cix+ciw-ps,y-8,30,2);
      mainW=ciw-ps-34;
    }
    ctx.globalAlpha=1;
  }
  y=drawBlocks(mainB, cix, mainW, y, small, blkAge);
  var yEnd=y;
  if(footB.length){
    var lsave=LINKS.length;
    ctx.save(); ctx.globalAlpha=0;
    var fh=drawBlocks(footB, cix, ciw, 0, small, blkAge);
    ctx.restore(); LINKS.length=lsave;
    var fGap=small?20:28, fTop=bot-fh-(small?16:22);
    if(fTop>y+fGap){ drawBlocks(footB, cix, ciw, fTop, small, blkAge); }
    else { yEnd=drawBlocks(footB, cix, ciw, y+fGap, small, blkAge); }
  }
  panelMax=Math.max(0,(yEnd+panelScroll)-(bot-18));
  var cage=Math.max(0,t-contentT);
  if(cage<0.26){
    var sp=cage/0.26, sy=top+(bot-top)*sp;
    ctx.globalAlpha=0.30*(1-sp); ctx.fillStyle=C_HI;
    ctx.fillRect(px+8,sy-9,pw-16,18);
    ctx.globalAlpha=0.85*(1-sp*0.7); ctx.fillStyle=C_HOT;
    ctx.fillRect(px+8,sy-0.75,pw-16,1.5); ctx.globalAlpha=1;
  }
  ctx.restore();
  if(panelMax>4){
    ctx.globalAlpha=0.4; ctx.fillStyle=C_DIM; ctx.font='400 '+(small?7:8)+'px Inter, sans-serif';
    tracked(UI.scroll,px+pw/2,bot+(small?11:14),2.6,'center'); ctx.globalAlpha=1;
  }

  /* ---- move between sheets without closing ---- */
  PREVB=null; NEXTB=null;
  var list = cs ? CASES : SECTIONS;
  var idx  = cs ? openCase : (function(){ for(var q=0;q<SECTIONS.length;q++) if(SECTIONS[q].id===openId) return q; return 0; })();
  var ny   = py+ph-(small?13:17);
  var nameOf=function(o){ return cs ? o.title : o.bin; };

  ctx.strokeStyle='rgba(63,126,121,0.3)'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(px+(small?14:26),ny-(small?19:23));
  ctx.lineTo(px+pw-(small?14:26),ny-(small?19:23)); ctx.stroke();

  ctx.font='400 '+(small?7:8.5)+'px Inter, sans-serif';
  ctx.fillStyle=C_DIM;
  var ctr=(cs?UI.kase:UI.section)+('0'+(idx+1)).slice(-2)+UI.of+('0'+list.length).slice(-2);
  var ctrHalf=measTracked(ctr,2.6)/2+14;
  tracked(ctr, px+pw/2, ny, 2.6,'center');
  /* a neighbour's name gets cut with … rather than run into the counter */
  var fitNav=function(txt,room,pre,post){
    if(measTracked(pre+txt+post,2.2)<=room) return pre+txt+post;
    var t=txt;
    while(t.length>1 && measTracked(pre+t+'…'+post,2.2)>room) t=t.slice(0,-1);
    return pre+t.replace(/[\s,.·—-]+$/,'')+'…'+post;
  };

  if(idx>0){
    ctx.font='500 '+(small?7.5:9)+'px Inter, sans-serif';
    var pxx=px+(small?18:30);
    var pt=fitNav(nameOf(list[idx-1]), (px+pw/2-ctrHalf)-pxx, '← ', '');
    var ptw=measTracked(pt,2.2);
    var phot=(mx>=pxx-10&&mx<=pxx+ptw+10&&my>=ny-(small?14:17)&&my<=ny+(small?9:11));
    ctx.fillStyle=phot?C_HOT:C_MID; tracked(pt,pxx,ny,2.2,'left');
    PREVB={x:pxx-10,y:ny-(small?14:17),w:ptw+20,h:(small?23:28),i:idx-1};
  }
  if(idx<list.length-1){
    ctx.font='500 '+(small?7.5:9)+'px Inter, sans-serif';
    var nt=fitNav(nameOf(list[idx+1]), (px+pw-(small?18:30))-(px+pw/2+ctrHalf), '', ' →');
    var ntw=measTracked(nt,2.2), nxx=px+pw-(small?18:30)-ntw;
    var nhot=(mx>=nxx-10&&mx<=nxx+ntw+10&&my>=ny-(small?14:17)&&my<=ny+(small?9:11));
    ctx.fillStyle=nhot?C_HOT:C_MID; tracked(nt,nxx,ny,2.2,'left');
    NEXTB={x:nxx-10,y:ny-(small?14:17),w:ntw+20,h:(small?23:28),i:idx+1};
  }
}

function goSheet(i){
  if(openCase!==null){ openCase=i; }
  else { openId=SECTIONS[i].id; }
  panelScroll=0; contentT=nowT(); clack(0);
}

/* ============================== interaction ============================== */
function evPos(e){var r=glc.getBoundingClientRect(),t=(e.touches&&e.touches[0])||e;
  /* where the shader actually drew what's under the cursor */
  var u=(t.clientX-r.left)/r.width, v=(t.clientY-r.top)/r.height;
  var cx=u*2-1, cy=v*2-1, r2=cx*cx+cy*cy, f=1+BK1*CUR_WARP*r2+BK2*CUR_WARP*r2*r2;
  u=(cx*f)*0.5+0.5; v=(cy*f)*0.5+0.5;
  u=(u-0.5)/CUR_ZOOM+0.5; v=(v-0.5)/CUR_ZOOM+0.5;
  return {x:u*W,y:v*H};}
function inBox(p,b){ return b&&p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h; }
function hitBtn(x,y){for(var i=0;i<BTN.length;i++){var b=BTN[i];
  if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return i;}return -1;}
function hitSpark(){ return null; }
function nowT(){ return (performance.now()-t0)/1000; }
function openSec(id,o){ openId=id; openCase=null; panelScroll=0; contentT=nowT()+0.34;
  if(o) panelOrigin={x:o.x,y:o.y,w:o.w,h:o.h};
  panelTarget=1; if(panelA>0.72) panelA=0.72; clack(0); }
function close(){ if(!openId) return; panelTarget=0; clack(0); }

glc.addEventListener('mousemove',function(e){
  var p=evPos(e); mx=p.x; my=p.y; lastAct=performance.now();
  hoverBtn=hitBtn(p.x,p.y);
  hoverSpark=openId?null:hitSpark(p.x,p.y);
  var overCard=false;
  if(openId&&openCase===null) for(var i=0;i<CARDS.length;i++) if(inBox(p,CARDS[i])) overCard=true;
  if(openId){
    for(var li2=0;li2<LINKS.length;li2++) if(inBox(p,LINKS[li2])) overCard=true;
    for(var ei2=0;ei2<EXPROWS.length;ei2++) if(inBox(p,EXPROWS[ei2])) overCard=true;
  }
  glc.style.cursor=(hoverBtn>=0||hoverSpark||overCard||(LANGB&&inBox(p,LANGB)&&!(openId&&inBox(p,PANEL)))||inBox(p,CLOSE)||inBox(p,BACK)||inBox(p,PREVB)||inBox(p,NEXTB))?'pointer':(openId?'default':'crosshair');
});
glc.addEventListener('mouseleave',function(){mx=my=-9999;hoverSpark=null;hoverBtn=-1;});
glc.addEventListener('click',function(e){
  var p=evPos(e); lastAct=performance.now(); audioOn();
  if(!introDone){ introDone=true; return; }
  if(LANGB&&inBox(p,LANGB)&&!(openId&&inBox(p,PANEL))){ clack(0); location.href=ALT_LANG_URL+'#flip'; return; }

  if(openId){
    if(inBox(p,CLOSE)){ if(openCase!==null){ openCase=null; panelScroll=0; contentT=nowT(); clack(0); } else close(); return; }
    if(inBox(p,BACK)){ openCase=null; panelScroll=0; contentT=nowT(); clack(0); return; }
    if(inBox(p,PREVB)){ goSheet(PREVB.i); return; }
    if(inBox(p,NEXTB)){ goSheet(NEXTB.i); return; }
    for(var li=0;li<LINKS.length;li++){
      var L=LINKS[li];
      if(inBox(p,L)){
        if(L.act==='copy'){
          try{ navigator.clipboard.writeText(L.val); }catch(err){}
          copiedWhat=L.val; copiedAt=performance.now();
        }else if(L.href){ openURL(L.href); }
        clack(0); return;
      }
    }
    for(var ei=0;ei<EXPROWS.length;ei++){
      if(inBox(p,EXPROWS[ei])){
        EXPAND[EXPROWS[ei].k]=!EXPAND[EXPROWS[ei].k];
        panelScroll=Math.min(panelScroll,panelMax); clack(0); return;
      }
    }
    if(openCase===null) for(var i=0;i<CARDS.length;i++) if(inBox(p,CARDS[i])){ openCase=CARDS[i].i; panelScroll=0; contentT=nowT(); clack(0); return; }
    var bi0=hitBtn(p.x,p.y);
    if(bi0>=0){ openSec(BTN[bi0].id, BTN[bi0]); return; }
    if(!inBox(p,PANEL)){ close(); return; }
    return;
  }
  var bi=hitBtn(p.x,p.y);
  if(bi>=0){ openSec(BTN[bi].id, BTN[bi]); return; }
});
glc.addEventListener('touchstart',function(e){
  var p=evPos(e); mx=p.x; my=p.y; lastAct=performance.now();
  hoverSpark=openId?null:hitSpark(p.x,p.y);
},{passive:true});
glc.addEventListener('touchmove',function(e){var p=evPos(e);mx=p.x;my=p.y;},{passive:true});
window.addEventListener('wheel',function(e){
  if(!openId)return; lastAct=performance.now();
  panelScroll=Math.max(0,Math.min(panelMax,panelScroll+e.deltaY));
},{passive:true});
var ty=null;
window.addEventListener('touchmove',function(e){
  if(!openId)return; var y=e.touches[0].clientY;
  if(ty!==null) panelScroll=Math.max(0,Math.min(panelMax,panelScroll+(ty-y)));
  ty=y;
},{passive:true});
window.addEventListener('touchend',function(){ty=null;});
document.addEventListener('keydown',function(e){
  lastAct=performance.now();
  introDone=true; audioOn();
  if(e.key==='Escape'){ if(openCase!==null){ openCase=null; contentT=nowT(); } else close(); return; }
  if(openId&&(e.key==='ArrowLeft')&&PREVB){ goSheet(PREVB.i); return; }
  if(openId&&(e.key==='ArrowRight')&&NEXTB){ goSheet(NEXTB.i); return; }
  var i=parseInt(e.key,10);
  if(i>=1&&i<=SECTIONS.length){ openSec(SECTIONS[i-1].id, BTN[i-1]); }
});

/* ============================== resize + loop ============================== */
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,1.5);
  var vw=window.innerWidth, vh=window.innerHeight;
  /* above laptop size, zoom the whole interface instead of spreading it out */
  UIS=Math.max(1,Math.min(2.4,Math.min(vw/1440,vh/860)));
  RS=DPR*UIS;
  W=vw/UIS; H=vh/UIS;
  scene.width=Math.round(vw*DPR); scene.height=Math.round(vh*DPR);
  glc.width=scene.width; glc.height=scene.height;
  glc.style.width=vw+'px'; glc.style.height=vh+'px';
  allocFBO(scene.width,scene.height);
  cellSize=W<760?12:14;
  atlasDim=buildAtlas(cellSize,C_MID,500);
  atlasHot=buildAtlas(cellSize,C_HOT,600);
  buildField();
}
window.addEventListener('resize',resize);

var uP={},uC={};
function locs(){
  uP.scene=gl.getUniformLocation(pP,'uScene'); uP.prev=gl.getUniformLocation(pP,'uPrev');
  uP.decay=gl.getUniformLocation(pP,'uDecay');
  uC.tex=gl.getUniformLocation(pC,'uTex'); uC.res=gl.getUniformLocation(pC,'uRes');
  uC.time=gl.getUniformLocation(pC,'uTime'); uC.flick=gl.getUniformLocation(pC,'uFlick');
  uC.warp=gl.getUniformLocation(pC,'uWarp');
  uC.zoom=gl.getUniformLocation(pC,'uZoom'); uC.open=gl.getUniformLocation(pC,'uOpen');
  uC.deg=gl.getUniformLocation(pC,'uDeg');
}
function frame(now){
  requestAnimationFrame(frame);
  var ip = (introDone||reduce) ? 1 : Math.min(1,(now-t0)/1700);
  if(ip>=1) introDone=true;
  var eo3=function(x){return 1-Math.pow(1-x,3);};
  var openV = ip<0.08 ? 0.012 : Math.max(0.012, eo3(Math.min(1,(ip-0.08)/0.34)));
  var zoomV = 0.54 + 0.46*eo3(Math.min(1,Math.max(0,(ip-0.10)/0.90)));
  panelA += (panelTarget-panelA)*(panelTarget?0.165:0.22);
  if(panelTarget===0 && panelA<0.02 && openId){ openId=null; openCase=null; panelScroll=0; panelA=0; }
  warpT = 1 - 0.74*panelA;
  warp += (warpT-warp)*0.14;
  drawScene(now);
  gl.bindTexture(gl.TEXTURE_2D,sceneTex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,scene);

  var nx=cur^1;
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo[nx]);
  gl.viewport(0,0,scene.width,scene.height);
  gl.useProgram(pP); bindQuad(pP);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,sceneTex); gl.uniform1i(uP.scene,0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,tex[cur]); gl.uniform1i(uP.prev,1);
  gl.uniform1f(uP.decay, reduce?0.0:(0.80-0.34*panelA));
  gl.drawArrays(gl.TRIANGLES,0,3);

  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,scene.width,scene.height);
  gl.useProgram(pC); bindQuad(pC);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,tex[nx]); gl.uniform1i(uC.tex,0);
  gl.uniform2f(uC.res,scene.width,scene.height);
  gl.uniform1f(uC.time,now/1000);
  CUR_WARP=warp*(1+0.55*(1-ip)); CUR_ZOOM=zoomV;
  gl.uniform1f(uC.warp, CUR_WARP);
  gl.uniform1f(uC.zoom, zoomV);
  gl.uniform1f(uC.open, openV);
  gl.uniform1f(uC.deg, Math.pow(Math.max(0,1-ip/0.22),2));
  var fl=1.0;
  if(!reduce){
    fl=1.0+Math.sin(now/1000*2.1)*0.004+Math.sin(now/1000*7.7)*0.003;
    /* brightness sag: rare, shallow, eased in and out — a breath, not a blink */
    var ns=now/1000;
    if(!SAG_NEXT) SAG_NEXT=ns+18+Math.random()*20;
    if(ns>=SAG_NEXT){ SAG_T=ns; SAG_NEXT=ns+25+Math.random()*20; }
    if(SAG_T>=0){ var sgp=(ns-SAG_T)/0.7; if(sgp<1) fl*=1-0.06*Math.sin(sgp*Math.PI); }
  }
  gl.uniform1f(uC.flick,fl);
  gl.drawArrays(gl.TRIANGLES,0,3);
  cur=nx;
}
function start(){ locs(); resize(); requestAnimationFrame(frame); }
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('700 28px Inter'),document.fonts.load('600 14px Inter'),
    document.fonts.load('400 15px Inter')]).catch(function(){}).then(start);
}else start();
})();
</script>
